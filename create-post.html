<!doctype html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.classList.remove("no-js");document.documentElement.classList.add("js");</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Post — Luma House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 14 L16 5 L27 14 L27 27 L5 27 Z' fill='none' stroke='%233A2636' stroke-width='2'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23C8A96A'/%3E%3C/svg%3E" />
</head>
<body>

  <nav class="lh-nav">
    <div class="lh-nav__inner">
      <a class="lh-logo" href="index.html">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path class="lh-logo__house" d="M5 14 L16 5 L27 14 L27 27 L5 27 Z" /><circle class="lh-logo__moon" cx="22" cy="10" r="3" /></svg>
        Luma House
      </a>
      <div class="lh-nav__links">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-post.html" class="active">Create</a>
        <a href="community.html">Community</a>
        <a href="products.html">Products</a>
      </div>
      <div class="lh-nav__cta">
        <a href="dashboard.html" class="btn-lh btn-lh--ghost btn-lh--sm"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <div class="lh-avatar" style="width: 38px; height: 38px; font-size: .95rem;">S</div>
      </div>
    </div>
  </nav>

  <section class="section section--tight">
    <div class="container-lh" style="max-width: 980px;">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
          <span class="eyebrow">Create</span>
          <h1 style="font-size: 2rem; margin: 0;">New post</h1>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" form="postForm" name="action" value="draft" class="btn-lh btn-lh--ghost">Save draft</button>
          <button type="submit" form="postForm" name="action" value="publish" class="btn-lh btn-lh--primary">Publish</button>
        </div>
      </div>

      <form id="postForm" data-prototype-form data-success-msg="Post published — your members are getting an email." data-success-redirect="dashboard.html">
        <div class="lh-card">
          <div class="mb-4">
            <label class="lh-label">Post title</label>
            <input class="lh-input" type="text" placeholder="The Sunday Letter: on choosing slowness…" value="" style="font-family: var(--font-display); font-size: 1.4rem; padding: 1rem;" required />
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="lh-label">Category</label>
              <select class="lh-select">
                <option>Wellness &amp; Mindset</option>
                <option>Devotional</option>
                <option>Tutorial</option>
                <option>Behind the scenes</option>
                <option>Member Q&amp;A</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="lh-label">Visibility</label>
              <div class="d-flex gap-2 flex-wrap">
                <label class="chip" style="cursor: pointer;">
                  <input type="radio" name="vis" style="display:none;" />
                  <i class="bi bi-eye"></i> Free preview
                </label>
                <label class="chip active" style="cursor: pointer;">
                  <input type="radio" name="vis" checked style="display:none;" />
                  <i class="bi bi-lock"></i> Subscribers only
                </label>
                <label class="chip" style="cursor: pointer;">
                  <input type="radio" name="vis" style="display:none;" />
                  <i class="bi bi-bag"></i> Paid download
                </label>
              </div>
            </div>
          </div>

          <!-- Upload -->
          <div class="mb-4">
            <label class="lh-label">Cover image or file</label>
            <label style="display: block; border: 2px dashed var(--line-strong); border-radius: var(--r-md); padding: 2rem; text-align: center; cursor: pointer; background: var(--ivory); transition: border-color .2s ease;">
              <i class="bi bi-cloud-arrow-up" style="font-size: 2rem; color: var(--plum);"></i>
              <div style="font-weight: 600; margin-top: .5rem;">Drop a file or click to upload</div>
              <div class="muted" style="font-size: .88rem; margin-top: .25rem;">JPG, PNG, PDF, MP3 — up to 250 MB</div>
              <input type="file" hidden />
            </label>
          </div>

          <!-- Editor toolbar -->
          <div class="mb-2 d-flex gap-1 flex-wrap" style="border: 1px solid var(--line); border-radius: var(--r-md); padding: .4rem;">
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><b>B</b></button>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i style="font-style: italic;">I</i></button>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><u>U</u></button>
            <div style="width: 1px; background: var(--line); margin: 0 .25rem;"></div>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i class="bi bi-type-h2"></i></button>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i class="bi bi-quote"></i></button>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i class="bi bi-list-ul"></i></button>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i class="bi bi-link-45deg"></i></button>
            <div style="width: 1px; background: var(--line); margin: 0 .25rem;"></div>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i class="bi bi-image"></i> Image</button>
            <button type="button" class="btn-lh btn-lh--soft btn-lh--sm" style="padding: .35rem .6rem;"><i class="bi bi-mic"></i> Audio</button>
          </div>

          <textarea class="lh-textarea" rows="14" placeholder="Write something only your community would get…">There's a quiet kind of confidence I've been thinking about lately. The kind that doesn't need to perform.

It shows up in the way a woman sets her cup down at the end of a sentence. The way she doesn't fill silence. The way she chooses, again and again, to be deeply herself rather than impressively anything.

This week I want to share three small practices that have helped me build that kind of presence in my own life…</textarea>

          <div class="d-flex justify-content-between align-items-center mt-4 pt-3" style="border-top: 1px solid var(--line);">
            <div class="d-flex gap-2 align-items-center muted" style="font-size: .88rem;">
              <i class="bi bi-people"></i> Will be sent to <strong style="color: var(--charcoal);">623 subscribers</strong>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn-lh btn-lh--ghost"><i class="bi bi-eye"></i> Preview</button>
              <button type="submit" name="action" value="draft" class="btn-lh btn-lh--soft">Save draft</button>
              <button type="submit" name="action" value="publish" class="btn-lh btn-lh--primary">Publish</button>
            </div>
          </div>
        </div>

        <!-- Schedule + tags row -->
        <div class="row g-3 mt-3">
          <div class="col-md-6">
            <div class="lh-card">
              <label class="lh-label">Schedule</label>
              <div class="d-flex gap-2 align-items-center">
                <input type="datetime-local" class="lh-input" />
                <span class="muted" style="font-size: .85rem;">or publish now</span>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="lh-card">
              <label class="lh-label">Tags</label>
              <input class="lh-input" type="text" placeholder="mindset, calm, sunday letter" />
              <div class="d-flex gap-2 mt-2">
                <span class="tag-mini">mindset</span>
                <span class="tag-mini">calm</span>
                <span class="tag-mini">sunday-letter</span>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
